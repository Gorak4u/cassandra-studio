name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-unit:
    name: Engine unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - name: Unit tests
        working-directory: engine
        run: ./gradlew --no-daemon test
      - name: SBOM (CycloneDX)
        working-directory: engine
        run: ./gradlew --no-daemon cyclonedxBom
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-unit-reports
          path: |
            engine/build/reports/tests
            engine/build/reports/bom.*
          retention-days: 14

  engine-integration:
    name: Integration (Cassandra ${{ matrix.cassandra }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The estate's mix: 3.11 on Java 8, 4.1 on Java 11, 5.0 on Java 17.
        cassandra: ["3.11", "4.1", "5.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - name: Integration tests against a real Cassandra container
        working-directory: engine
        run: ./gradlew --no-daemon test -Pintegration -PcassandraVersions=${{ matrix.cassandra }} --tests '*IntegrationTest'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-reports-${{ matrix.cassandra }}
          path: engine/build/reports/tests
          retention-days: 14

  ui:
    name: UI typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: ui/package-lock.json }
      - working-directory: ui
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        working-directory: ui
        run: npm test
      - name: Typecheck and build
        working-directory: ui
        run: npm run build
      - name: Audit production dependencies
        working-directory: ui
        run: npm audit --omit=dev --audit-level=high

  keychain:
    name: OS keychain (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - name: Secrets round-trip through the real keychain
        working-directory: engine
        shell: bash
        run: ./gradlew --no-daemon test -Pkeychain

  e2e:
    name: Browser test on real clusters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: ui/package-lock.json }
      # Clusters boot in the background while the engine and UI build.
      - name: Start test-env (2-DC 4.1 cluster, 3.11, and 5.0 with TLS + login)
        run: |
          test-env/make-certs.sh
          docker compose -f test-env/docker-compose.yml --profile secure up -d
      - name: Build engine and UI
        run: |
          (cd engine && ./gradlew --no-daemon -q shadowJar)
          (cd ui && npm ci --no-audit --no-fund && npm run build && npx playwright install --with-deps chromium)
      - name: Wait for every node to be up
        run: docker compose -f test-env/docker-compose.yml --profile secure up -d --wait --wait-timeout 600
      - name: Start engine
        run: |
          java -jar engine/build/libs/cassandra-studio-engine-all.jar --port 18080 --token e2e --data-dir "$RUNNER_TEMP/studio" \
            --ui-dir ui/dist --no-keyring > "$RUNNER_TEMP/engine.log" 2>&1 &
          for _ in $(seq 1 60); do grep -q STUDIO_ENGINE_READY "$RUNNER_TEMP/engine.log" && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/engine.log"; exit 1
      - name: Drive the UI
        working-directory: ui
        run: node tests/smoke.mjs http://127.0.0.1:18080 e2e "$RUNNER_TEMP/screens"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/screens
          retention-days: 14
      - name: Engine and cluster logs
        if: failure()
        run: |
          cat "$RUNNER_TEMP/engine.log" || true
          docker compose -f test-env/docker-compose.yml --profile secure ps
          docker compose -f test-env/docker-compose.yml --profile secure logs --tail 50

  desktop:
    name: Desktop window (Electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: "ui/package-lock.json" }
      - name: Build app resources (engine, Java runtime, UI) and Electron
        run: |
          sudo apt-get install -y xvfb >/dev/null
          RESOURCES_ONLY=1 scripts/package.sh >/dev/null
          (cd desktop && npm ci --no-audit --no-fund)
      - name: Launch under Xvfb, check UI, startup time and clean exit
        run: |
          # Ubuntu 24.04 blocks unprivileged user namespaces via AppArmor; Chromium's sandbox needs them.
          # Lift it on the runner rather than running Electron with --no-sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          mkdir -p "$RUNNER_TEMP/screens"
          cd ui && xvfb-run -a -s "-screen 0 1500x950x24" node tests/desktop-window.mjs ../desktop "$RUNNER_TEMP/screens/desktop-window.png" 15000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-window
          path: ${{ runner.temp }}/screens
          retention-days: 14

  dependency-scan:
    name: Dependency vulnerabilities (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - name: Build engine jar
        working-directory: engine
        run: ./gradlew --no-daemon -q shadowJar
      # Trivy from its pinned image (the trivy-action tags were withdrawn upstream).
      - name: Scan npm lockfiles (UI and desktop)
        run: |
          for lock in ui/package-lock.json desktop/package-lock.json; do
            docker run --rm -v "$PWD":/src -v "$HOME/.cache/trivy":/root/.cache/trivy aquasec/trivy:0.58.1 \
              fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "/src/$lock"
          done
      - name: Scan engine jar (Java dependencies)
        run: |
          docker run --rm -v "$PWD":/src -v "$HOME/.cache/trivy":/root/.cache/trivy aquasec/trivy:0.58.1 \
            rootfs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /src/engine/build/libs
