name: Release

# Builds the desktop installers on each OS and publishes them as a GitHub Release when
# either a v* tag is pushed, or the workflow is run by hand with a version (it then
# creates the tag itself). A manual run without a version only uploads workflow artifacts.
# A version with a hyphen (0.1.0-alpha.1) is published as a pre-release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0-alpha.1 (blank = build only)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  installers:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 (AppImage, deb, rpm)
            os: ubuntu-latest
            java-arch: x64
            builder-args: --linux AppImage deb rpm --x64
          - name: Windows x64 (installer)
            os: windows-latest
            java-arch: x64
            builder-args: --win nsis --x64
          - name: macOS Apple Silicon (dmg)
            os: macos-latest
            java-arch: aarch64
            builder-args: --mac dmg --arm64
          - name: macOS Intel (dmg)
            os: macos-latest
            # An x64 JDK (runs under Rosetta) so jlink produces an x64 runtime.
            java-arch: x64
            builder-args: --mac dmg --x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", architecture: "${{ matrix.java-arch }}", cache: gradle }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Bad version $INPUT_VERSION"; exit 1; }
            echo "STUDIO_VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "STUDIO_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          fi
      - name: Build installer
        env:
          # Signing secrets (NFR-SIGN). Each is exported only when it is set: an empty
          # CSC_LINK makes electron-builder treat "" as a path and fail.
          MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          WIN_CERT: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          args="${{ matrix.builder-args }}"
          if [ "$RUNNER_OS" = "macOS" ]; then cert="$MAC_CERT"; pass="$MAC_CERT_PASSWORD"; else cert="$WIN_CERT"; pass="$WIN_CERT_PASSWORD"; fi
          if [ -n "$cert" ]; then
            export CSC_LINK="$cert" CSC_KEY_PASSWORD="$pass"
            if [ "$RUNNER_OS" = "macOS" ] && [ -n "$NOTARY_APPLE_ID" ]; then
              export APPLE_ID="$NOTARY_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$NOTARY_PASSWORD" APPLE_TEAM_ID="$NOTARY_TEAM_ID"
            fi
          elif [ "$RUNNER_OS" = "macOS" ]; then
            # No Developer ID yet: ad-hoc sign, without which Apple Silicon reports the app as damaged.
            args="$args -c.mac.identity=-"
          fi
          scripts/package.sh $args
      - name: Checksums
        working-directory: desktop/dist
        run: |
          for f in *.AppImage *.deb *.rpm *.exe *.dmg; do
            [ -f "$f" ] || continue
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}-${{ matrix.java-arch }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: installers
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Cassandra Studio ${{ inputs.version != '' && inputs.version || github.ref_name }}
          files: dist/*
          prerelease: ${{ contains(inputs.version != '' && inputs.version || github.ref_name, '-') }}
          generate_release_notes: true
