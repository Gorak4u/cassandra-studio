# Local test clusters matching the estate's mix (see README):
#   acme-core   Cassandra 4.1 (Java 11): dc_east x2 + dc_west x1      -> 127.0.0.1:19042
#   legacy-311  Cassandra 3.11 (Java 8), single node                  -> 127.0.0.1:29042
#   secure-50   Cassandra 5.0 (Java 17), client TLS + password auth   -> 127.0.0.1:39042 (profile "secure")
#   profile "jmx": node access for the JMX tests (JmxAccessIntegrationTest), see below
# Start:  ./make-certs.sh && docker compose --profile secure --profile jmx up -d   (profiles are optional)
# Nodes join one at a time; `docker compose ps` shows them healthy when ready (2-4 min).
#
# Node access (profile "jmx"; keys and known_hosts come from ./make-certs.sh, in ssh/):
#   The 4.1 nodes keep the stock LOCAL_JMX=yes, as in the estate: JMX on the node's localhost only (registry
#   on 7199, RMI server object on a random port; Studio forwards both through the one SSH session).
#   Each one gets an sshd sidecar sharing its network namespace, so SSH to the node lands next to its
#   localhost:7199. User "studio", key ssh/id_test (or password "studio-test"), host key in ssh/known_hosts:
#     east1 -> 127.0.0.1:2201   east2 -> 127.0.0.1:2202   west1 -> 127.0.0.1:2203   (container port 2222)
#     bastion (jump host) -> 127.0.0.1:2200; from there the nodes are east1:2222, east2:2222, west1:2222
#   legacy-311 serves remote JMX without auth on 127.0.0.1:27199 (DIRECT method; always on, no profile).

x-cassandra: &cassandra
  environment: &env
    MAX_HEAP_SIZE: 512M
    HEAP_NEWSIZE: 100M
    CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    # Test-only speed-ups for EMPTY nodes (never use on real clusters): no gossip-settle wait, short ring delay.
    JVM_EXTRA_OPTS: -Dcassandra.skip_wait_for_gossip_to_settle=0 -Dcassandra.ring_delay_ms=1000
  healthcheck:
    # Exact match: nodetool's own error text ("...Is it running?") must not count as healthy.
    test: ["CMD-SHELL", "nodetool statusbinary 2>/dev/null | grep -qx running"]
    interval: 10s
    timeout: 10s
    retries: 40
    start_period: 30s

x-sshd: &sshd
  image: linuxserver/openssh-server:10.3_p1-r1-ls238
  profiles: [jmx]
  entrypoint: ["/bin/bash", "/keys/sshd-prepare.sh"]
  environment: { USER_NAME: studio, PUBLIC_KEY_FILE: /keys/id_test.pub, PASSWORD_ACCESS: "true", USER_PASSWORD: studio-test }
  volumes:
    - ./sshd-prepare.sh:/keys/sshd-prepare.sh:ro
    - ./ssh/id_test.pub:/keys/id_test.pub:ro
    - ./ssh/host_ed25519_key:/keys/host_ed25519_key:ro
    - ./ssh/host_ed25519_key.pub:/keys/host_ed25519_key.pub:ro
    # Estate backup scripts stub (estate-stub/: same paths, CLI and output as the control repo's
    # scripts) and one shared "bucket" (local backend) for all nodes, like an S3 bucket.
    - ./estate-stub/usr/local/bin:/usr/local/bin:ro
    - ./estate-stub/etc/backup:/etc/backup:ro
    - estate-backups:/var/backups/cassandra

services:
  east1:
    <<: *cassandra
    image: cassandra:4.1
    hostname: east1
    networks: { default: { ipv4_address: 10.231.42.11 } }
    environment: { <<: *env, CASSANDRA_CLUSTER_NAME: acme-core, CASSANDRA_SEEDS: east1, CASSANDRA_NUM_TOKENS: "16", CASSANDRA_DC: dc_east, CASSANDRA_RACK: rack1 }
    ports: ["19042:9042", "2201:2222"]
  east2:
    <<: *cassandra
    image: cassandra:4.1
    hostname: east2
    networks: { default: { ipv4_address: 10.231.42.12 } }
    # Empty test node: join without bootstrap streaming. Parallel bootstraps could stall a node in JOINING
    # for minutes (seen in CI); with nothing to stream, auto_bootstrap: false is safe and joins in seconds.
    entrypoint: ["bash", "-c", "grep -q '^auto_bootstrap:' /etc/cassandra/cassandra.yaml || echo 'auto_bootstrap: false' >> /etc/cassandra/cassandra.yaml; exec docker-entrypoint.sh cassandra -f"]
    environment: { <<: *env, CASSANDRA_CLUSTER_NAME: acme-core, CASSANDRA_SEEDS: east1, CASSANDRA_NUM_TOKENS: "16", CASSANDRA_DC: dc_east, CASSANDRA_RACK: rack2 }
    ports: ["2202:2222"]
    depends_on: { east1: { condition: service_healthy } }
  west1:
    <<: *cassandra
    image: cassandra:4.1
    hostname: west1
    networks: { default: { ipv4_address: 10.231.42.13 } }
    # Empty test node: join without bootstrap streaming. Parallel bootstraps could stall a node in JOINING
    # for minutes (seen in CI); with nothing to stream, auto_bootstrap: false is safe and joins in seconds.
    entrypoint: ["bash", "-c", "grep -q '^auto_bootstrap:' /etc/cassandra/cassandra.yaml || echo 'auto_bootstrap: false' >> /etc/cassandra/cassandra.yaml; exec docker-entrypoint.sh cassandra -f"]
    environment: { <<: *env, CASSANDRA_CLUSTER_NAME: acme-core, CASSANDRA_SEEDS: east1, CASSANDRA_NUM_TOKENS: "16", CASSANDRA_DC: dc_west, CASSANDRA_RACK: rack1 }
    ports: ["2203:2222"]
    depends_on: { east1: { condition: service_healthy } }

  # sshd sidecars (profile jmx): inside each node's network namespace, with its data volume read-only
  # so df over SSH sees the node's disk;, so their port 2222 is published
  # on the node service above and "localhost:7199" is the node's JMX.
  east1-ssh: { <<: *sshd, network_mode: "service:east1", volumes_from: ["east1:ro"] }
  east2-ssh: { <<: *sshd, network_mode: "service:east2", volumes_from: ["east2:ro"] }
  west1-ssh: { <<: *sshd, network_mode: "service:west1", volumes_from: ["west1:ro"] }
  # 5.0 node: SSH reachable only through the bastion (secure50:2222), like a node with no public SSH.
  secure50-ssh: { <<: *sshd, network_mode: "service:secure50", volumes_from: ["secure50:ro"], profiles: [secure] }
  bastion:
    <<: *sshd
    hostname: bastion
    ports: ["2200:2222"]

  legacy311:
    <<: *cassandra
    image: cassandra:3.11
    hostname: legacy311
    networks: { default: { ipv4_address: 10.231.42.21 } }
    # Remote JMX without auth on 27199 (same port inside and on the host, and stubs name 127.0.0.1),
    # so the host reaches it with plain JMX/RMI: the DIRECT access method.
    environment:
      <<: *env
      CASSANDRA_CLUSTER_NAME: legacy-311
      CASSANDRA_DC: dc1
      LOCAL_JMX: "no"
      JVM_EXTRA_OPTS: >-
        -Dcassandra.skip_wait_for_gossip_to_settle=0 -Dcassandra.ring_delay_ms=1000
        -Dcassandra.jmx.remote.port=27199 -Dcom.sun.management.jmxremote.rmi.port=27199
        -Dcom.sun.management.jmxremote.authenticate=false -Djava.rmi.server.hostname=127.0.0.1
    ports: ["29042:9042", "27199:27199"]
    healthcheck:
      test: ["CMD-SHELL", "nodetool -p 27199 statusbinary 2>/dev/null | grep -qx running"]
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 30s

  secure50:
    <<: *cassandra
    image: cassandra:5.0
    hostname: secure50
    networks: { default: { ipv4_address: 10.231.42.31 } }
    profiles: [secure]
    environment: { <<: *env, CASSANDRA_CLUSTER_NAME: secure-50, CASSANDRA_DC: dc1 }
    ports: ["39042:9042"]
    volumes: ["./certs/node.jks:/certs/node.jks:ro"]
    # Same edits as SecureClusterIntegrationTest: PasswordAuthenticator, CassandraAuthorizer, client TLS.
    entrypoint:
      - bash
      - -c
      - >-
        CONF=/etc/cassandra/cassandra.yaml &&
        sed -i 's/AllowAllAuthenticator/PasswordAuthenticator/; s/AllowAllAuthorizer/CassandraAuthorizer/' $$CONF &&
        sed -i '/^client_encryption_options:/,/^[a-z]/ { s/^\(\s*\)enabled: false/\1enabled: true/; s#^\(\s*\)keystore: .*#\1keystore: /certs/node.jks#; s/^\(\s*\)#\{0,1\}keystore_password: .*/\1keystore_password: changeit/ }' $$CONF &&
        exec docker-entrypoint.sh cassandra -f

# Fixed node addresses: Cassandra keeps its peers' IPs on disk, so a node that comes back with another
# node's old address (Docker hands out IPs in start order) refuses to rejoin. Other containers take
# addresses from the upper half only.
networks:
  default:
    ipam:
      config: [{ subnet: 10.231.42.0/24, ip_range: 10.231.42.128/25 }]

# The estate-stub backup "bucket" shared by the sshd sidecars (see x-sshd).
volumes:
  estate-backups: {}
